<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedar Merge Gatekeeper - Decision Dashboard</title>
    <!-- Tailwind CSS for sleek, modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Heroicons for SVGs -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <header class="mb-10 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900">Cedar Merge Gatekeeper</h1>
                <p class="text-slate-500 mt-1">Live authorization decision log & policy analytics</p>
            </div>
            <div>
                <button onclick="fetchDecisions()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition-colors shadow-sm">
                    <i data-feather="refresh-cw" class="w-4 h-4"></i>
                    Refresh Data
                </button>
            </div>
        </header>

        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="text-sm font-medium text-slate-500 mb-1">Total Evaluated</div>
                <div class="text-3xl font-bold text-slate-900" id="stat-total">-</div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="text-sm font-medium text-slate-500 mb-1">Allowed Requests</div>
                <div class="text-3xl font-bold text-emerald-600" id="stat-allowed">-</div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="text-sm font-medium text-slate-500 mb-1">Denied Requests</div>
                <div class="text-3xl font-bold text-rose-600" id="stat-denied">-</div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="text-sm font-medium text-slate-500 mb-1">Degraded / Neutral</div>
                <div class="text-3xl font-bold text-amber-500" id="stat-neutral">-</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Chart Column -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 h-full">
                    <h2 class="text-lg font-semibold text-slate-900 mb-4">Decisions by Policy</h2>
                    <div class="relative h-64 w-full">
                        <canvas id="policyChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Feed Column -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 h-full">
                    <h2 class="text-lg font-semibold text-slate-900 mb-4">Recent Authorization Decisions</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-200 text-sm text-slate-500">
                                    <th class="pb-3 font-medium">Verdict</th>
                                    <th class="pb-3 font-medium">Principal</th>
                                    <th class="pb-3 font-medium">Resource</th>
                                    <th class="pb-3 font-medium">Determining Policy</th>
                                    <th class="pb-3 font-medium">Timestamp</th>
                                </tr>
                            </thead>
                            <tbody id="decision-feed" class="text-sm">
                                <!-- JS inserts rows here -->
                                <tr><td colspan="5" class="py-4 text-center text-slate-400">Loading decisions...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Feather icons
        feather.replace();

        let policyChartInstance = null;
        
        // You will need to replace this URL with your actual API Gateway URL once deployed
        const API_URL = "REPLACE_ME_WITH_YOUR_API_URL/decisions";

        async function fetchDecisions() {
            try {
                if (API_URL.includes("REPLACE_ME")) {
                    renderMockData();
                    return;
                }

                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("API Failed");
                const data = await response.json();
                updateDashboard(data.decisions);
            } catch (err) {
                console.error("Failed to fetch decisions:", err);
                document.getElementById('decision-feed').innerHTML = 
                    `<tr><td colspan="5" class="py-4 text-center text-rose-500">Failed to load data. Is your API Gateway URL configured?</td></tr>`;
            }
        }

        function updateDashboard(decisions) {
            let total = decisions.length;
            let allowed = 0, denied = 0, neutral = 0;
            let policyCounts = {};

            const tbody = document.getElementById('decision-feed');
            tbody.innerHTML = '';

            decisions.forEach(d => {
                // Update stats
                if (d.verdict === 'ALLOW') allowed++;
                else if (d.verdict === 'DENY') denied++;
                else neutral++;

                if (d.policyId) {
                    policyCounts[d.policyId] = (policyCounts[d.policyId] || 0) + 1;
                }

                // Append row
                const row = document.createElement('tr');
                row.className = "border-b border-slate-100 hover:bg-slate-50 transition-colors";
                
                let verdictBadge = '';
                if (d.verdict === 'ALLOW') verdictBadge = '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-100 text-emerald-800">ALLOW</span>';
                else if (d.verdict === 'DENY') verdictBadge = '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-rose-100 text-rose-800">DENY</span>';
                else verdictBadge = '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-amber-100 text-amber-800">NEUTRAL</span>';

                const timeStr = new Date(d.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

                row.innerHTML = `
                    <td class="py-3">${verdictBadge}</td>
                    <td class="py-3 font-medium text-slate-700">${d.principal || '-'}</td>
                    <td class="py-3 text-slate-500">${d.resource || '-'}</td>
                    <td class="py-3"><code class="text-xs bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded border border-slate-200">${d.policyId || 'unknown'}</code></td>
                    <td class="py-3 text-slate-400">${timeStr}</td>
                `;
                tbody.appendChild(row);
            });

            if (decisions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">No decisions recorded yet. Trigger a webhook!</td></tr>`;
            }

            // Update DOM
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-allowed').innerText = allowed;
            document.getElementById('stat-denied').innerText = denied;
            document.getElementById('stat-neutral').innerText = neutral;

            updateChart(policyCounts);
        }

        function updateChart(policyCounts) {
            const ctx = document.getElementById('policyChart').getContext('2d');
            const labels = Object.keys(policyCounts);
            const data = Object.values(policyCounts);
            
            // Tailwind colors
            const colors = [
                '#6366f1', // Indigo
                '#10b981', // Emerald
                '#f43f5e', // Rose
                '#f59e0b', // Amber
                '#8b5cf6'  // Violet
            ];

            if (policyChartInstance) policyChartInstance.destroy();

            policyChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length ? labels : ['No Data'],
                    datasets: [{
                        data: data.length ? data : [1],
                        backgroundColor: data.length ? colors : ['#e2e8f0'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'Inter, sans-serif' } } }
                    },
                    cutout: '70%'
                }
            });
        }

        // Dummy data for when the API URL isn't replaced yet
        function renderMockData() {
            const mock = [
                {verdict: "DENY", principal: "alice", resource: "org/repo#45", policyId: "large-pr-requires-senior", timestamp: new Date().toISOString()},
                {verdict: "ALLOW", principal: "vikash", resource: "org/repo#45", policyId: "engineering-default", timestamp: new Date(Date.now() - 60000).toISOString()},
                {verdict: "DENY", principal: "bob", resource: "org/repo#44", policyId: "no-self-approval", timestamp: new Date(Date.now() - 120000).toISOString()},
                {verdict: "ALLOW", principal: "akarsh", resource: "org/repo#43", policyId: "security-owns-auth", timestamp: new Date(Date.now() - 360000).toISOString()},
                {verdict: "NEUTRAL", principal: "alice", resource: "org/repo#42", policyId: "AVP_UNREACHABLE", timestamp: new Date(Date.now() - 860000).toISOString()}
            ];
            updateDashboard(mock);
            // Append a reminder message
            const tr = document.createElement('tr');
            tr.innerHTML = `<td colspan="5" class="py-4 text-center text-rose-500 font-medium">⚠️ Showing MOCK data. Replace API_URL in index.html to see live data!</td>`;
            document.getElementById('decision-feed').appendChild(tr);
        }

        // Run on load
        fetchDecisions();
    </script>
</body>
</html>
